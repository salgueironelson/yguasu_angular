<div class="bg-grey-100 flex items-center justify-center min-h-100">
  <div class="w-full max-w-md bg-white p-8 rounded-lg shadow-lg">
    
    <h1 class="text-2xl font-bold text-center text-gray-800 mb-6"> Ingrese sus credenciales </h1>
    <form class="space-y-5" [formGroup] ="loginForm" (ngSubmit)="funIngresar()">
      <div>
        <label for="" class="block text-gray-700">Ingrese su Correo:</label>
        <input type="text" formControlName="email" placeholder="tucorreo@mail.com" 
               class="w-full px-4 py-2 border rounded-lg"/>
        <div *ngIf="loginForm.controls.email.errors && loginForm.controls.email.touched">
          <small *ngIf="loginForm.controls.email.errors['required']">El correo es obligatorio.</small>
          <small *ngIf="loginForm.controls.email.errors['email']">El correo es incorrecto.</small>
        </div>
        <br/>
      </div>
      <div>
        <label for="" class="block text-gray-700">Ingrese su Contraseña:</label>
        <input type="password" formControlName="password" 
               class="w-full px-4 py-2 border rounded-lg"/>
        <div *ngIf="loginForm.controls.password.errors && loginForm.controls.password.touched">
          <small *ngIf="loginForm.controls.password.errors['required']">La contraseña es obligatoria.</small>
          <small *ngIf="loginForm.controls.password.errors['minlength']">La contraseña debe tener al menos 6 caracteres.</small>
        </div>
      </div>
      <button type="submit" [disabled]="!loginForm.valid" 
              class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-800 transition duration-200">
        Iniciar Sesión
      </button>
    </form>
  

{{ loginForm.value.email }}
{{ loginForm.value.password }}

  </div>
</div>
